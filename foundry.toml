[profile.default]
solc = "0.8.25"
evm_version = "cancun"
src = "src"
out = "out"
test = "test"
libs = ["dependencies"]
fs_permissions = [{ access = "read-write", path = "./" }]
viaIR = true

# Managed with Soldeer (`forge soldeer install`). Layout mirrors flare-foundry-starter.
[dependencies]
forge-std = "1.9.5"
flare-periphery = "0.1.37"

[soldeer]
remappings_generate = false
remappings_regenerate = false
remappings_version = false
remappings_location = "txt"
recursive_deps = true

[rpc_endpoints]
coston2 = "${COSTON2_RPC_URL}"

# Blockscout verification (no API key needed):
#   --verifier blockscout --verifier-url https://coston2-explorer.flare.network/api/
