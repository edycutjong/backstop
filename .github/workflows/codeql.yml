name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "27 3 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Covers the Next.js app in web/ and the TS keeper/spike scripts in scripts/.
        language: ["javascript-typescript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        # Code scanning upload needs GitHub Advanced Security, which private repos
        # on the free plan don't have. Analyze always; upload only when public
        # (auto-enables at submission). continue-on-error guards the weekly schedule.
        continue-on-error: true
        with:
          upload: ${{ github.event.repository.visibility == 'public' && 'always' || 'never' }}
