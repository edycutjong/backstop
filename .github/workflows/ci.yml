name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: Quality (format) ──────────────────────────────
  format:
    name: "Stage 1 · Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install Soldeer dependencies
        run: forge soldeer install
      - name: Check formatting
        run: forge fmt --check

  # ── Stage 2: Build ─────────────────────────────────────────
  build:
    name: "Stage 2 · Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install Soldeer dependencies
        run: forge soldeer install
      - name: Build
        run: forge build --sizes

  # ── Stage 3: Test + coverage ───────────────────────────────
  test:
    name: "Stage 3 · Test"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install Soldeer dependencies
        run: forge soldeer install
      - name: Run tests
        run: forge test -vvv
      - name: Coverage summary (unit — no fork)
        run: forge coverage --no-match-coverage "(script|test)" --summary || true

  # ── Web · Quality (Next.js frontend in web/) ───────────────
  web-quality:
    name: "Web · Quality"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Lint (Next.js ESLint)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build

  # ── Web · E2E (Playwright against the real read-only app) ──
  web-e2e:
    name: "Web · E2E"
    runs-on: ubuntu-latest
    needs: [web-quality]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Run E2E tests
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # ── Web · Performance (Lighthouse CI — advisory) ───────────
  web-performance:
    name: "Web · Performance"
    runs-on: ubuntu-latest
    needs: [web-quality]
    continue-on-error: true
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Lighthouse CI
        run: npx lhci autorun
        continue-on-error: true

  # ── Release · automatic semantic version (main only, all checks green) ──
  release:
    name: "Release · semantic-version"
    runs-on: ubuntu-latest
    needs: [format, build, test, web-quality, web-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # create tags + releases + commit CHANGELOG
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semrel.outputs.published }}
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so commit-analyzer sees every commit
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Semantic Release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx --yes
          -p semantic-release@24
          -p @semantic-release/changelog@6
          -p @semantic-release/exec@6
          -p @semantic-release/git@10
          semantic-release

  # ── Deploy · Vercel production (only when a NEW version was released) ──
  deploy:
    name: "Deploy · Vercel (production)"
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.outputs.published == 'true'
    environment: production
    defaults:
      run:
        working-directory: web
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Gate on Vercel secrets (skip cleanly if not configured)
        id: gate
        working-directory: ${{ github.workspace }} # runs before checkout — web/ doesn't exist yet
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Vercel deploy skipped::Set repo secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID to enable production deploys."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - name: Setup Node.js
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        if: steps.gate.outputs.ready == 'true'
        run: npm i -g vercel@latest
      - name: Pull Vercel env (production)
        if: steps.gate.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build (Vercel, prod)
        if: steps.gate.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ needs.release.outputs.version }}
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy prebuilt to production
        if: steps.gate.outputs.ready == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} > deployment-url.txt
      - name: Summarize deployment
        if: steps.gate.outputs.ready == 'true'
        run: |
          echo "### 🚀 Deployed v${{ needs.release.outputs.version }} to production" >> "$GITHUB_STEP_SUMMARY"
          echo "$(cat deployment-url.txt)" >> "$GITHUB_STEP_SUMMARY"
