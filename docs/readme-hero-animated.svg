<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img"
     aria-label="Backstop — redemption insurance for FXRP on Flare. A guard is bought against a redemption ticket; the FAsset agent defaults; the FDC proves the payment never happened; Backstop verifies it on-chain and pays the redeemer make-whole (guard #1 PAID, 111.55 C2FLR).">
<!-- ╔══════════════════════════════════════════════════════════════════════════╗
     ║ 🛟 BACKSTOP — README hero · ANIMATED · 1280×320 banner · one 8.0s loop     ║
     ╚══════════════════════════════════════════════════════════════════════════╝
     The SVG twin of the README banner — self-contained, ~13 KB, crisp at any scale.
     Motion is SMIL ONLY (no CSS @keyframes): it plays inside GitHub <img> embeds AND
     is fully seekable, so the frame-exporter hook at the bottom is deterministic.
     Wordmark + mark are hand-drawn monoline paths (DESIGN.md §3) — never a font, and
     the tagline uses the system mono stack, so type is pixel-identical everywhere.

     The claim settles, dramatized (all beats are pure functions of the 8s clock):
       0.02–0.16s  the backstop cradle draws in — the guarantee is in place first
       0.02–0.30s  an insured ticket pops · its deadline bar depletes to zero
       0.30s       AGENT DEFAULT × blinks on
       0.34–0.44s  FDC · RPN requestAttestation() — the default report streams over
       0.46–0.62s  IFdcVerification.verify(proof) ✓ draws on-chain (99.3 s, measured)
       0.60–0.82s  the redemption falls along its arc into the cradle · landing ripple
       0.73–0.84s  PAID seal pops · 111.55 C2FLR make-whole (guard #1, real on Coston2)
       0.84–0.94s  POSTER HOLD — the settled claim, a clean still
       0.94–1.00s  the story loop-fades; brand column + green floor persist, then loop

     Colors are CSS var() with #hex fallback: rasterized standalone they take the hex;
     embedded in a page that loads _tokens.css the brand retunes live.
     ── Deterministic export: __DUR_MS = 8000 · __POSTER_MS = 7000 · 200 frames @25fps ── -->
<defs>
  <clipPath id="plate"><rect width="1280" height="320" rx="24"/></clipPath>
  <pattern id="net" width="36" height="36" patternUnits="userSpaceOnUse">
    <circle cx="18" cy="18" r="1.5" fill="var(--ink-line,#24303F)"/>
  </pattern>
  <filter id="aura" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="cometBlur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="breath" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>

  <!-- wordmark shimmer: one guard-green highlight band sweeps across STOP per loop.
       Coords are in the STOP group's LOCAL frame (translate 56,128 · scale .52) — the S-T-O-P
       glyph translates are baked into their path data below so all four share this one frame,
       which is what makes userSpaceOnUse land the moving highlight ON the strokes. -->
  <linearGradient id="wmGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="160" y2="0">
    <stop offset="0"    stop-color="var(--primary,#3ECF9A)"/>
    <stop offset="0.40" stop-color="var(--primary,#3ECF9A)"/>
    <stop offset="0.5"  stop-color="#C4F6E2"/>
    <stop offset="0.60" stop-color="var(--primary,#3ECF9A)"/>
    <stop offset="1"    stop-color="var(--primary,#3ECF9A)"/>
    <animateTransform attributeName="gradientTransform" type="translate" dur="8s" repeatCount="indefinite"
                      values="300 0;300 0;780 0;780 0" keyTimes="0;0.18;0.4;1"/>
  </linearGradient>
  <linearGradient id="beamGrad" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="var(--mist-100,#E9EDF2)" stop-opacity="0"/>
    <stop offset="0.5" stop-color="var(--mist-100,#E9EDF2)" stop-opacity="0.35"/>
    <stop offset="1" stop-color="var(--mist-100,#E9EDF2)" stop-opacity="0"/>
  </linearGradient>
</defs>

<g clip-path="url(#plate)">
  <!-- ══ backdrop (persistent) ══ -->
  <rect width="1280" height="320" fill="var(--ink-950,#0D1522)"/>
  <rect width="1280" height="320" fill="url(#net)"/>
  <circle cx="1040" cy="30" r="180" fill="var(--primary,#3ECF9A)" opacity="0.07" filter="url(#aura)">
    <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" calcMode="spline"
                      values="0 0;-70 26;0 0" keyTimes="0;0.5;1" keySplines=".42 0 .58 1;.42 0 .58 1"/>
  </circle>
  <circle cx="170" cy="300" r="160" fill="var(--accent,#0B7A57)" opacity="0.09" filter="url(#aura)">
    <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" calcMode="spline"
                      values="0 0;60 -20;0 0" keyTimes="0;0.5;1" keySplines=".42 0 .58 1;.42 0 .58 1"/>
  </circle>

  <!-- one beam sweep per loop -->
  <g transform="skewX(-14)" opacity="0.5">
    <rect x="0" y="-20" width="140" height="360" fill="url(#beamGrad)" opacity="0.12">
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
                        values="-320 0;-320 0;1620 0;1620 0" keyTimes="0;0.3;0.55;1"/>
    </rect>
  </g>

  <!-- ══ LEFT: brand column (persistent) ══ -->
  <!-- mini mark — the backstop cradle, with a soft breath glow -->
  <g transform="translate(58,30) scale(0.82)">
    <path d="M 96 6 V 76 A 28 28 0 0 1 68 104 H 24" fill="none" stroke="var(--primary,#3ECF9A)"
          stroke-width="17" stroke-linecap="round" filter="url(#breath)" opacity="0.25">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline"
               keyTimes="0;0.5;1" values="0.18;0.5;0.18" keySplines=".42 0 .58 1;.42 0 .58 1"/>
    </path>
    <path d="M 96 6 V 76 A 28 28 0 0 1 68 104 H 24" fill="none" stroke="var(--primary,#3ECF9A)" stroke-width="17" stroke-linecap="round"/>
    <circle cx="68" cy="76" r="19.5" fill="var(--paper,#F7F6F1)"/>
  </g>

  <!-- outlined wordmark: BACK in paper, STOP in the shimmering guard gradient -->
  <g transform="translate(56,128) scale(0.52)" fill="none" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="var(--paper,#F7F6F1)">
      <path d="M11 8 V92 M11 8 H36 A21 21 0 0 1 36 50 H11 M11 50 H42 A21 21 0 0 1 42 92 H11"/>
      <path transform="translate(100,0)" d="M8 92 L38 8 L68 92 M20 60 H56"/>
      <path transform="translate(204,0)" d="M64 21 A37 37 0 1 0 64 79"/>
      <path transform="translate(302,0)" d="M12 8 V92 M62 8 L14 54 M33 41 L64 92"/>
    </g>
    <g stroke="url(#wmGrad)">
      <path d="M458 16 C436 5 413 14 413 31 C413 48 461 49 461 68 C461 87 434 96 411 84"/>
      <path d="M502 8 H562 M532 8 V92"/>
      <ellipse cx="634" cy="50" rx="31" ry="42"/>
      <path d="M712 8 V92 M712 8 H739 A23 23 0 0 1 739 54 H712"/>
    </g>
  </g>

  <!-- tagline · proof metric (pulse) · stack · real on-chain proof -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="58" y="210" font-size="17" fill="var(--mist-100,#E9EDF2)">Redemption insurance for FXRP.</text>
    <text x="58" y="238" font-size="15.5" fill="var(--primary,#3ECF9A)">&gt; agent defaults &#8594; Flare&#8217;s own proof pays you make-whole
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" values="0.7;1;0.7" keySplines=".42 0 .58 1;.42 0 .58 1"/></text>
    <text x="58" y="264" font-size="12.5" fill="var(--slate-500,#55677D)">FDC &#183; FASSETS/FXRP &#183; FTSO V2 &#183; COSTON2 (114)</text>
    <text x="58" y="292" font-size="12.5" fill="var(--slate-300,#8CA0B3)"><tspan fill="var(--primary,#3ECF9A)">&#10003;</tspan> FDC GATE 99.3s &#183; GUARD #1 PAID &#183; <tspan fill="var(--paper,#F7F6F1)">111.55 C2FLR</tspan></text>
  </g>

  <!-- ══ RIGHT: the claim settles (story — loop-fades after the poster hold) ══ -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.02;0.94;1" values="0;1;1;0"/>

    <!-- ① insured ticket (rises in; border warms to amber at the default) -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.02;0.05;1" values="0;0;1;1"/>
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" calcMode="spline"
                        keyTimes="0;0.02;0.05;1" values="0 8;0 8;0 0;0 0" keySplines="0 0 1 1;.2 1.4 .4 1;0 0 1 1"/>
      <rect x="600" y="56" width="190" height="58" rx="14" fill="var(--ink-800,#182433)" stroke-width="2" stroke="var(--slate-500,#55677D)">
        <animate attributeName="stroke" dur="8s" repeatCount="indefinite" values="#55677D;#55677D;#F2B94B;#F2B94B" keyTimes="0;0.29;0.31;1"/>
      </rect>
      <text x="695" y="81" text-anchor="middle" font-size="15" fill="var(--paper,#F7F6F1)">TICKET #4821</text>
      <text x="695" y="102" text-anchor="middle" font-size="12" fill="var(--slate-300,#8CA0B3)">5,000 XRP OWED</text>
    </g>

    <!-- deadline depletes -->
    <rect x="600" y="130" width="190" height="6" rx="3" fill="var(--ink-line,#24303F)"/>
    <rect x="600" y="130" height="6" rx="3" fill="var(--amber-300,#F2B94B)">
      <animate attributeName="width" dur="8s" repeatCount="indefinite" values="190;190;0;0" keyTimes="0;0.06;0.30;1"/>
    </rect>
    <text x="600" y="164" font-size="14" fill="var(--amber-300,#F2B94B)" opacity="0">AGENT DEFAULT &#215;
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.29;0.30;0.32;0.34;0.36;0.38;1" values="0;0;1;0.25;1;0.4;1;1"/></text>

    <!-- ② FDC · RPN attestation request -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.34;0.38;1"/>
      <rect x="860" y="48" width="220" height="74" rx="14" fill="var(--ink-800,#182433)" stroke="var(--primary,#3ECF9A)" stroke-width="2"/>
      <text x="970" y="79" text-anchor="middle" font-size="15" fill="var(--paper,#F7F6F1)">FDC &#183; RPN</text>
      <text x="970" y="103" text-anchor="middle" font-size="12.5" fill="var(--primary,#3ECF9A)">requestAttestation()</text>
    </g>
    <!-- comet: the default report streams to the FDC -->
    <circle r="5" fill="var(--primary,#3ECF9A)" filter="url(#cometBlur)" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.36;0.37;0.43;0.44;1"/>
      <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.36;0.44;1" calcMode="linear" path="M 790 85 H 860"/>
    </circle>

    <!-- ③ on-chain verification -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.48;0.52;1"/>
      <rect x="860" y="170" width="220" height="74" rx="14" fill="var(--ink-800,#182433)" stroke="var(--primary,#3ECF9A)" stroke-width="2"/>
      <text x="970" y="201" text-anchor="middle" font-size="14.5" fill="var(--paper,#F7F6F1)">IFdcVerification</text>
      <text x="970" y="225" text-anchor="middle" font-size="12.5" fill="var(--primary,#3ECF9A)">verify(proof)</text>
    </g>
    <!-- comet: proof → verifier -->
    <circle r="5" fill="var(--primary,#3ECF9A)" filter="url(#cometBlur)" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.46;0.47;0.51;0.52;1"/>
      <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.46;0.52;1" calcMode="linear" path="M 970 122 V 170"/>
    </circle>
    <!-- check badge draws · 99.3 s measured -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.53;0.55;1"/>
      <circle cx="1102" cy="207" r="16" fill="var(--ink-950,#0D1522)" stroke="var(--primary,#3ECF9A)" stroke-width="3"/>
      <path d="M 1094 207 l 6 7 l 11 -13" fill="none" stroke="var(--primary,#3ECF9A)" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray: 100;">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" values="100;100;0;0" keyTimes="0;0.55;0.62;1"/>
      </path>
      <text x="1090" y="263" text-anchor="middle" font-size="12.5" fill="var(--primary,#3ECF9A)" opacity="0">99.3s on-chain
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.60;0.66;1"/></text>
    </g>

    <!-- ④ the backstop cradle draws in early, then breathes as it catches the payout -->
    <g transform="translate(1128,150) scale(0.95)">
      <path d="M 96 6 V 76 A 28 28 0 0 1 68 104 H 24" fill="none" stroke="var(--primary,#3ECF9A)" stroke-width="17"
            stroke-linecap="round" filter="url(#breath)" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0;0.45;0.2;0.5;0.5;0" keyTimes="0;0.7;0.78;0.84;0.89;0.94;0.97;1"/>
      </path>
      <path d="M 96 6 V 76 A 28 28 0 0 1 68 104 H 24" fill="none" stroke="var(--primary,#3ECF9A)" stroke-width="17"
            stroke-linecap="round" style="stroke-dasharray: 160;">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" values="160;160;0;0" keyTimes="0;0.04;0.16;1"/>
      </path>
    </g>
    <!-- trajectory hint of the falling payout -->
    <path d="M 1102 200 C 1150 190 1182 196 1191 216" fill="none" stroke="var(--slate-500,#55677D)"
          stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 16" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0.9;0.9" keyTimes="0;0.60;0.64;1"/>
    </path>
    <!-- the redemption dot falls into the cradle -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.63;0.65;1"/>
      <g>
        <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.64;0.74;1" calcMode="linear" path="M 1102 200 C 1150 190 1182 196 1192.6 222.2"/>
        <circle cx="0" cy="0" r="18.5" fill="var(--paper,#F7F6F1)"/>
      </g>
    </g>
    <!-- landing ripple -->
    <circle cx="1192.6" cy="222.2" fill="none" stroke="var(--primary,#3ECF9A)" stroke-width="4" opacity="0">
      <animate attributeName="r" dur="8s" repeatCount="indefinite" values="24;24;60;60" keyTimes="0;0.73;0.82;1"/>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0.5;0;0" keyTimes="0;0.73;0.75;0.82;1"/>
    </circle>

    <!-- PAID seal pops · make-whole payout, real on Coston2 -->
    <g transform="translate(1193 277)">
      <animateTransform attributeName="transform" type="scale" additive="sum" dur="8s" repeatCount="indefinite" calcMode="spline"
                        keyTimes="0;0.73;0.76;0.79;1" values="0.6;0.6;1.12;1;1" keySplines="0 0 1 1;.2 1.4 .4 1;.42 0 .58 1;0 0 1 1"/>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.73;0.76;1"/>
      <rect x="-37" y="-15" width="74" height="30" rx="15" fill="var(--primary,#3ECF9A)"/>
      <text x="0" y="6" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink-950,#0D1522)">PAID</text>
    </g>
    <text x="1148" y="283" text-anchor="end" font-size="12.5" fill="var(--slate-500,#55677D)" opacity="0">111.55 C2FLR
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.79;0.84;1"/></text>
  </g>

  <!-- the green floor the whole banner rests on (signature, persistent) -->
  <rect x="0" y="312" width="1280" height="8" fill="var(--primary,#3ECF9A)"/>
</g>

<style>
  @media (prefers-reduced-motion: reduce) { animate, animateTransform, animateMotion { display: none; } }
</style>

<!-- Deterministic seek hook for the frame-exporter (inert inside <img>; SMIL plays on its own).
     Inline this file via page.setContent() then call window.__seek(ms). __POSTER_MS rests on the settled claim. -->
<script><![CDATA[
  (function () {
    try {
      if (typeof window === "undefined" || typeof document === "undefined") return;
      var svg = document.querySelector("svg") || document.documentElement;
      if (!svg || typeof svg.setCurrentTime !== "function") return;
      var DUR = 8000;
      window.__DUR_MS = DUR;
      window.__POSTER_MS = 7000;
      window.__ready = Promise.resolve(true);
      window.__seek = function (ms) { var t = ((ms % DUR) + DUR) % DUR; svg.pauseAnimations(); svg.setCurrentTime(t / 1000); return t; };
      window.__play = function () { svg.unpauseAnimations(); };
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) window.__seek(window.__POSTER_MS);
    } catch (e) {}
  })();
]]></script>
</svg>
