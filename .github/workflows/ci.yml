name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: Quality (format) ──────────────────────────────
  format:
    name: "Stage 1 · Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install Soldeer dependencies
        run: forge soldeer install
      - name: Check formatting
        run: forge fmt --check

  # ── Stage 2: Build ─────────────────────────────────────────
  build:
    name: "Stage 2 · Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install Soldeer dependencies
        run: forge soldeer install
      - name: Build
        run: forge build --sizes

  # ── Stage 3: Test + coverage ───────────────────────────────
  test:
    name: "Stage 3 · Test"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install Soldeer dependencies
        run: forge soldeer install
      - name: Run tests
        run: forge test -vvv
      - name: Coverage summary (unit — no fork)
        run: forge coverage --no-match-coverage "(script|test)" --summary || true

  # ── Web · Quality (Next.js frontend in web/) ───────────────
  web-quality:
    name: "Web · Quality"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Lint (Next.js ESLint)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Unit tests (Vitest)
        run: npm run test:unit

  # ── Web · E2E (Playwright against the real read-only app) ──
  web-e2e:
    name: "Web · E2E"
    runs-on: ubuntu-latest
    needs: [web-quality]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Run E2E tests
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # ── Web · Performance (Lighthouse CI — advisory) ───────────
  web-performance:
    name: "Web · Performance"
    runs-on: ubuntu-latest
    needs: [web-quality]
    continue-on-error: true
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Lighthouse CI
        run: npx lhci autorun
        continue-on-error: true

  # ── Release · automatic semantic version (main only, all checks green) ──
  release:
    name: "Release · semantic-version"
    runs-on: ubuntu-latest
    needs: [format, build, test, web-quality, web-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # create tags + releases + commit CHANGELOG
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semrel.outputs.published }}
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so commit-analyzer sees every commit
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Semantic Release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx --yes
          -p semantic-release@24
          -p @semantic-release/changelog@6
          -p @semantic-release/exec@6
          -p @semantic-release/git@10
          semantic-release

  # ── Deploy · Vercel production (AFTER release, so it ships the bumped version) ──
  deploy:
    name: "Deploy · Vercel (production)"
    runs-on: ubuntu-latest
    needs: [release] # release already needs format/build/test/web-quality/web-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Best-effort: a Vercel hiccup must not fail build validation.
    continue-on-error: true
    environment:
      name: production
      url: https://backstop.edycu.dev
    defaults:
      run:
        working-directory: web
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # pull the branch tip so we deploy the just-committed release bump
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve version (released this run, else current package.json)
        id: ver
        run: |
          v="${{ needs.release.outputs.version }}"
          [ -z "$v" ] && v="$(node -p "require('./package.json').version")"
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "Deploying version $v"
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull Vercel env (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build (Vercel, prod)
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ steps.ver.outputs.v }}
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy prebuilt to production
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "### 🚀 Deployed v${{ steps.ver.outputs.v }} to production" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
